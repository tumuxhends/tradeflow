<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TradeFlow</title>
<meta name="theme-color" content="#0f172a" id="themeColor">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TradeFlow">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script>
  // apply saved theme before first paint (no flash)
  try {
    var s = JSON.parse(localStorage.getItem('tradeflow.v2') || '{}');
    var p = s.theme || 'dark';
    var t = p === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : p;
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
</head>
<body>
<div class="bg-animation"><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div></div>

<div id="app">
  <main>
    <section class="page active" id="page-home"></section>
    <section class="page" id="page-stocks"></section>
    <section class="page" id="page-referral"></section>
    <section class="page" id="page-profile"></section>
    <section class="page" id="page-finance"></section>
  </main>
</div>

<nav class="bubble-nav" id="nav" aria-label="Main">
  <div class="nav-inner">
    <div class="bubble-indicator" id="indicator"></div>
    <button class="nav-item active" data-page="home"><span class="ic"></span><span class="l">Home</span></button>
    <button class="nav-item" data-page="stocks"><span class="ic"></span><span class="l">Stocks</span></button>
    <button class="nav-item" data-page="finance"><span class="ic"></span><span class="l">Finance</span></button>
    <button class="nav-item" data-page="referral"><span class="ic"></span><span class="l">Referral</span></button>
    <button class="nav-item" data-page="profile"><span class="ic"></span><span class="l">Profile</span></button>
  </div>
</nav>

<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"><div class="ti"></div><div><b id="toastTitle"></b><span id="toastMsg"></span></div></div>
<div class="login hidden" id="login">
  <div class="logo"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/></svg></div>
  <h1>TradeFlow</h1><p>You have been signed out.</p>
  <button class="btn" id="signIn">Sign in</button>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
